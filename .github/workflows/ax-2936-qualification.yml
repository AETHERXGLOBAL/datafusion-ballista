# AETHER X GLOBAL fork-only qualification; never part of the upstream patch.
name: AX 2936 exact-source qualification
on:
  push:
    branches: ["ci/2936-qualification"]
    paths: [".github/workflows/ax-2936-qualification.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    container:
      image: amd64/rust
    env:
      CARGO_TARGET_DIR: /tmp/ax-2936-target
    steps:
      # RED is already established by upstream CI runs 45719905225,
      # jobs 139575317659 and 139575317765. Keep their exact source unchanged.
      # This delta qualifies the formatting successor without repeating RED.
      - uses: actions/checkout@v7.0.1
        with:
          ref: 0a9e79d484b912f72437f2ec14f95504d93ca7e6
          fetch-depth: 0
          persist-credentials: false
      - name: Trust only the checked-out workspace in the ephemeral container
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "0a9e79d484b912f72437f2ec14f95504d93ca7e6"
          test "$(git rev-parse HEAD^{tree})" = "cba6666412ede92a2b95ee8d6dc824cb83b139ce"
      - uses: ./.github/actions/setup-builder
      - name: GREEN exact candidate tests (umask 022)
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "0a9e79d484b912f72437f2ec14f95504d93ca7e6"
          test "$(git rev-parse HEAD^{tree})" = "cba6666412ede92a2b95ee8d6dc824cb83b139ce"
          umask 022
          cargo test --locked --profile ci -p ballista-executor --lib -- --test-threads=2
      - name: Unix restrictive umask regression (077)
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "0a9e79d484b912f72437f2ec14f95504d93ca7e6"
          umask 077
          cargo test --locked --profile ci -p ballista-executor --lib standalone::tests::standalone_ -- --test-threads=1
      - name: Format
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "0a9e79d484b912f72437f2ec14f95504d93ca7e6"
          cargo fmt --all -- --check
          git diff --check a879ad07d204d26df702c681fcb8101dfa1e6c2c HEAD
      - name: Cargo check
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "0a9e79d484b912f72437f2ec14f95504d93ca7e6"
          cargo check --locked --profile ci -p ballista-executor --all-targets
      - name: Clippy
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "0a9e79d484b912f72437f2ec14f95504d93ca7e6"
          rustup component add clippy
          cargo clippy --locked --profile ci -p ballista-executor --lib --tests -- -D warnings
