# AETHER X GLOBAL fork-only qualification; never part of the upstream patch.
name: AX 2936 exact-source qualification
on:
  push:
    branches: ["ci/2936-qualification"]
    paths: [".github/workflows/ax-2936-qualification.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    container:
      image: amd64/rust
    env:
      CARGO_TARGET_DIR: /tmp/ax-2936-target
    steps:
      # RED is already established by upstream CI runs 45719905225,
      # jobs 139575317659 and 139575317765. Keep their exact source unchanged.
      # This delta qualifies the new ownership tests without repeating original RED.
      - uses: actions/checkout@v7.0.1
        with:
          ref: 6831465ca3445bbc1ee612534cdefda533b25e41
          fetch-depth: 0
          persist-credentials: false
      - name: Trust only the checked-out workspace in the ephemeral container
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "6831465ca3445bbc1ee612534cdefda533b25e41"
          test "$(git rev-parse HEAD^{tree})" = "fc4b732e26e56b8a171b70356ebab657992ee9fb"
      - uses: ./.github/actions/setup-builder
      # Run 45726676278 established Linux/macOS GREEN under both umasks and
      # all four D4 assertion failures on the formatting predecessor.
      # The successor applies only rustfmt; preserve evidence rather than rerun.
      - name: Verify formatting-only delta against tested predecessor
        shell: bash
        run: |
          set -euxo pipefail
          git diff --exit-code f6ddcb66d947b72ea8d1d6c592bbd19f98c12968 HEAD -- . ':!ballista/executor/src/executor.rs' ':!ballista/executor/src/flight_service.rs' ':!ballista/executor/src/standalone.rs'
          python3 - <<'PY'
          import re
          import subprocess
          for path in ("executor.rs", "flight_service.rs", "standalone.rs"):
              path = "ballista/executor/src/" + path
              before = subprocess.check_output(["git", "show", "f6ddcb66d947b72ea8d1d6c592bbd19f98c12968:" + path])
              after = subprocess.check_output(["git", "show", "HEAD:" + path])
              def normalize(s):
                  return re.sub(rb",\)", b")", re.sub(rb"\s", b"", s))
              assert normalize(before) == normalize(after), path
          PY
      - name: Format
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "6831465ca3445bbc1ee612534cdefda533b25e41"
          cargo fmt --all -- --check
          git diff --check a879ad07d204d26df702c681fcb8101dfa1e6c2c HEAD
      - name: Cargo check
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "6831465ca3445bbc1ee612534cdefda533b25e41"
          cargo check --locked --profile ci -p ballista-executor --all-targets
      - name: Clippy
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "6831465ca3445bbc1ee612534cdefda533b25e41"
          rustup component add clippy
          cargo clippy --locked --profile ci -p ballista-executor --lib --tests -- -D warnings

