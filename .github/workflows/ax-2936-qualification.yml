# AETHER X GLOBAL fork-only qualification; never part of the upstream patch.
name: AX 2936 exact-source qualification
on:
  push:
    branches: ["ci/2936-qualification"]
    paths: [".github/workflows/ax-2936-qualification.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUSTFLAGS: "-C debuginfo=1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 24e711a0216d3ec72fc8bf915733b420e55ae562
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact frozen candidate
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "24e711a0216d3ec72fc8bf915733b420e55ae562"
          test "$(git rev-parse HEAD^{tree})" = "e69ce3835ada336883674a359872842b4b69be16"
          mkdir -p "$RUNNER_TEMP/ax2936-publication-lint"
          printf 'source=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > "$RUNNER_TEMP/ax2936-publication-lint/source.txt"
      - name: Setup upstream prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          rustup toolchain install stable
          rustup default stable
          rustup component add clippy
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c
        with:
          tool: taplo-cli@0.10.0
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c
        with:
          tool: cargo-machete@0.9.2
      - name: ASR-B2936-03 remaining upstream lint scripts
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/ax2936-publication-lint"
          # rustfmt passed on this exact source in run 45788510590.
          # Execute only the remaining upstream script scopes; no regression reruns.
          failed=0
          for script in rust_toml_fmt rust_machete rust_proto_check rust_config_docs_check rust_docs rust_clippy; do
            printf '%s\n' "ci/scripts/$script.sh" > "$dir/$script.command"
            set +e
            "ci/scripts/$script.sh" 2>&1 | tee "$dir/$script.log"
            rc=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$rc" > "$dir/$script.exit"
            if test "$rc" != 0; then failed=1; fi
          done
          git diff --exit-code
          test "$failed" = 0
      - name: Evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/ax2936-publication-lint"
          mkdir -p "$dir"
          cd "$dir"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ax2936-publication-lint-${{ github.run_id }}
          path: ${{ runner.temp }}/ax2936-publication-lint/
          if-no-files-found: error
