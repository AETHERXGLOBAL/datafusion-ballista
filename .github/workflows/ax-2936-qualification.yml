# AETHER X GLOBAL fork-only qualification; never part of the upstream patch.
name: AX 2936 exact-source qualification
on:
  push:
    branches: ["ci/2936-qualification"]
    paths: [".github/workflows/ax-2936-qualification.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    container:
      image: amd64/rust
    env:
      CARGO_TARGET_DIR: /tmp/ax-2936-target
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: cb4f222eb5517aa9f73d3afaedefbfa1a6de8663
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "cb4f222eb5517aa9f73d3afaedefbfa1a6de8663"
          test "$(git rev-parse HEAD^{tree})" = "c66c5dae6201f95d2f92250382e60127e4d9bc26"
      - uses: ./.github/actions/setup-builder
      # Accepted functional/mutation evidence stays at predecessor aed8b4c870990f47cffbaa96954239d67acb24cf.
      - name: Verify exact rustfmt-only delta
        shell: bash
        run: |
          set -euxo pipefail
          git diff --exit-code aed8b4c870990f47cffbaa96954239d67acb24cf HEAD -- . ':!ballista/executor/src/executor.rs'
          python3 - <<'PY'
          import subprocess
          path = "ballista/executor/src/executor.rs"
          before = subprocess.check_output(["git","show","aed8b4c870990f47cffbaa96954239d67acb24cf:" + path]).decode()
          after = subprocess.check_output(["git","show","HEAD:" + path]).decode()
          before = before.replace("        use ballista_core::utils::disk_writer_test_gate;\n        use ballista_core::serde::encode_protobuf;", "        use ballista_core::serde::encode_protobuf;")
          before = before.replace("            Action as BallistaAction, ByteRange, ShuffleFileKind, ShuffleLayout,\n        };\n        use futures::StreamExt;", "            Action as BallistaAction, ByteRange, ShuffleFileKind, ShuffleLayout,\n        };\n        use ballista_core::utils::disk_writer_test_gate;\n        use futures::StreamExt;")
          before = before.replace("        let writer_saw_file = gate.finished.recv_timeout(Duration::from_secs(10)).unwrap();", "        let writer_saw_file =\n            gate.finished.recv_timeout(Duration::from_secs(10)).unwrap();")
          assert before == after
          PY
          mkdir -p "$RUNNER_TEMP/ax2936-e01-e06"
          printf 'source=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > "$RUNNER_TEMP/ax2936-e01-e06/source.txt"
      - name: E04 Format
        shell: bash
        run: |
          set -euxo pipefail
          cargo fmt --all -- --check
          git diff --check a879ad07d204d26df702c681fcb8101dfa1e6c2c HEAD
      - name: E04 Cargo check
        shell: bash
        run: |
          set -euxo pipefail
          cargo check --locked --profile ci -p ballista-executor --all-targets
      - name: E04 Clippy
        shell: bash
        run: |
          set -euxo pipefail
          rustup component add clippy
          cargo clippy --locked --profile ci -p ballista-executor --lib --tests -- -D warnings
      - name: E04 Verify no gate in normal dependency feature set
        shell: bash
        run: |
          set -euxo pipefail
          cargo tree --locked -p ballista-executor -e features,no-dev > "$RUNNER_TEMP/ax2936-e01-e06/release-features.txt"
          ! grep -F 'test-disk-writer-gate' "$RUNNER_TEMP/ax2936-e01-e06/release-features.txt"
      - name: E03 evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/ax2936-e01-e06"
          mkdir -p "$dir"
          cd "$dir"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ax2936-e01-e06-${{ github.run_id }}
          path: ${{ runner.temp }}/ax2936-e01-e06/
          if-no-files-found: error
